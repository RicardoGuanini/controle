<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2b26;--mut:#6b7a73;--acc:#1f6b4f;--acc2:#e9f2ec;--red:#b3402f;--line:#ddd6c6;--blue:#2f5f8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1e2723;--ink:#eef2ee;--mut:#94a49b;--acc:#5fc29a;--acc2:#24352d;--red:#e57a67;--line:#31403a;--blue:#7fb0dd}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1e2723;--ink:#eef2ee;--mut:#94a49b;--acc:#5fc29a;--acc2:#24352d;--red:#e57a67;--line:#31403a;--blue:#7fb0dd}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;max-width:480px;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.sans,button,input{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:56px}
header h1{font-size:20px;flex:1}
.ic{width:40px;height:40px;border-radius:12px;font-size:22px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
main{flex:1;overflow:auto;padding:6px 18px 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%;max-height:520px}
.big{border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:20px;border:1px solid var(--line);background:var(--card)}
.big small{font:13px system-ui;color:var(--mut)}
.big span.e{font-size:34px}
.big.g{background:var(--acc);color:#fff;border-color:var(--acc)}.big.g small{color:#d5eadf}
.big.r{background:var(--red);color:#fff;border-color:var(--red)}.big.r small{color:#f6d9d3}
.val{font:700 44px Georgia,serif;text-align:center;padding:20px 0}
.val.d{color:var(--red)}.val.c{color:var(--acc)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:14px;font-size:22px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-size:16px}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt .e{display:block;font-size:26px;margin-bottom:4px}
h2{font-size:17px;margin:4px 0 12px}
.foot{display:flex;gap:10px;padding:12px 18px 16px}
.foot button{flex:1;padding:15px;border-radius:14px;font-size:16px;border:1px solid var(--line);background:var(--card)}
.foot .go{background:var(--acc);color:#fff;border-color:var(--acc);flex:2}
.foot .go:disabled{opacity:.4}
.mes{font:600 13px system-ui;color:var(--mut);margin:16px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .t{display:flex;justify-content:space-between;gap:8px}
.row .s{font:12px system-ui;color:var(--mut);margin-top:2px}
.row .a{display:flex;gap:6px;margin-top:10px}
.row .a button{flex:1;padding:8px;font-size:13px;border-radius:10px;border:1px solid var(--line)}
.row .a .p{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{font:11px system-ui;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.late{color:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.k small{font:12px system-ui;color:var(--mut)}.k b{display:block;font-size:20px;margin-top:4px}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:5;display:none}
.ov.on{display:block}
.side{position:absolute;top:0;bottom:0;left:0;width:78%;background:var(--card);z-index:6;transform:translateX(-105%);transition:transform .22s;padding:20px 8px;overflow:auto}
.side.on{transform:none}
.side button{display:block;width:100%;text-align:left;padding:13px 12px;font-size:16px;border-radius:12px}
.side button:active{background:var(--acc2)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);z-index:7;border-radius:22px 22px 0 0;padding:20px;transform:translateY(105%);transition:transform .22s}
.sheet.on{transform:none}
.sheet input{width:100%;font-size:26px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font:14px system-ui;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="mn"></main>
  <div class="foot" id="ft" style="display:none"></div>
  <div class="ov" id="ov"></div>
  <nav class="side" id="sd"></nav>
  <div class="sheet" id="sh"></div>
  <div class="toast" id="ts"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const R=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOJE=iso(new Date());
const mLabel=k=>{const[y,m]=k.split('-');return MN[+m-1]+'/'+y};
const addM=(d,n)=>{let[y,m,dd]=d.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12)+1;return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(dd,28)).padStart(2,'0')};
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
let id=20;
let items=[
{id:3,d:'Posto',v:300,t:'Cartão Nubank',dt:'2026-09-20',c:'Transporte',ve:'2026-10-10',p:0,k:'d'},
{id:13,d:'Farmácia',v:940.9,t:'Cartão Nubank',dt:'2026-09-20',c:'Saúde',ve:'2026-10-10',p:0,k:'d'},
{id:4,d:'Restaurante',v:530,t:'Cartão Itaú',dt:'2026-09-20',c:'Lazer',ve:'2026-10-15',p:0,k:'d'},
{id:5,d:'Móveis Bela 2/6',v:450,t:'Crediário',q:'Móveis Bela',c:'Casa',ve:'2026-10-20',p:0,k:'d'},
{id:6,d:'Móveis Bela 3/6',v:450,t:'Crediário',q:'Móveis Bela',c:'Casa',ve:'2026-11-20',p:0,k:'d'},
{id:12,d:'Loja Josefa 2/4',v:15.5,t:'Crediário',q:'Loja Josefa',c:'Roupas',ve:'2026-10-18',p:0,k:'d'},
{id:7,d:'Internet',v:120,t:'Conta fixa',c:'Moradia',ve:'2026-09-28',p:0,k:'d'},
{id:8,d:'Mercado',v:386.2,t:'Pix',c:'Alimentação',ve:'2026-09-12',p:1,k:'d'},
{id:9,d:'Salário',v:6200,t:'Conta',c:'Salário',ve:'2026-09-05',p:1,k:'r'},
{id:10,d:'Freela',v:900,t:'Conta',c:'Extra',ve:'2026-10-12',p:0,k:'r'}];
const CATS=[['🛒','Alimentação'],['🏠','Moradia'],['🚗','Transporte'],['💊','Saúde'],['🎉','Lazer'],['📚','Educação'],['👕','Roupas'],['📦','Outros']];
const RCATS=[['💼','Salário'],['💻','Extra'],['🎁','Presente'],['📈','Rendimento']];
const CARTOES=[{n:'Nubank',fe:3,vd:10},{n:'Itaú',fe:8,vd:15},{n:'Inter',fe:20,vd:25}];
const CONTAS=[{n:'Conta corrente',s:2500},{n:'Dinheiro',s:150},{n:'Poupança',s:5000},{n:'Vale Alimentação',s:600,v:1}];
const isV=n=>CONTAS.some(c=>c.v&&c.n==n),main=()=>(CONTAS.find(c=>!c.v)||CONTAS[0]).n;
let MOV=[],PA='Conta corrente',ORC={Alimentação:800,Transporte:400,Lazer:300};
const mv=(a,v,d,dt)=>MOV.push({a,v,d,dt:dt||HOJE});
const sal=c=>c.s+MOV.filter(m=>m.a==c.n).reduce((a,m)=>a+m.v,0);
const LOJAS=['Móveis Bela','Loja Josefa'];
const REC=[{id:'r1',d:'Aluguel',v:1800,dia:5,k:'d',t:'Conta fixa',c:'Moradia'},{id:'r2',d:'Luz',v:210.4,dia:8,k:'d',t:'Conta fixa',c:'Moradia'},{id:'r3',d:'Internet',v:120,dia:28,k:'d',t:'Conta fixa',c:'Moradia'},{id:'r4',d:'Salário',v:6200,dia:5,k:'r',t:'Conta',c:'Salário'},{id:'r5',d:'Recarga do vale',v:600,dia:5,k:'r',t:'Conta',c:'Extra',a:'Vale Alimentação'}];
function gen(){const b=HOJE.slice(0,8)+'01';REC.forEach(r=>{for(let m=0;m<13;m++){const dt=addM(b,m).slice(0,8)+String(Math.min(r.dia,28)).padStart(2,'0');if(dt<HOJE)continue;if(!items.some(i=>i.rid==r.id&&i.ve.slice(0,7)==dt.slice(0,7)))items.push({id:++id,rid:r.id,a:r.a,d:r.d,v:r.v,t:r.t,c:r.c,ve:dt,p:0,k:r.k})}})}
function cardVe(n,i,dt){dt=dt||HOJE;const c=CARTOES.find(x=>x.n==n),dia=+dt.slice(8);let base=dia>=c.fe?1:0;if(c.vd<c.fe)base++;return addM(dt.slice(0,8)+String(Math.min(c.vd,28)).padStart(2,'0'),base+i)}
let f=null,S='home';
const el=(h)=>{$('mn').innerHTML=h;persist()};
function toast(t){const x=$('ts');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)}
function head(t,back){$('hd').innerHTML=(back?'<button class="ic" onclick="back()">←</button>':'<button class="ic" onclick="menu(1)">☰</button>')+'<h1>'+t+'</h1>'}
function foot(h){const x=$('ft');x.style.display=h?'flex':'none';x.innerHTML=h||''}
function home(){S='home';f=null;head('Meu Controle');foot();
el((!items.length?`<div class="row" style="margin-bottom:10px"><b>Bem-vindo!</b><div class="s sans">Comece pelo menu ☰: cadastre suas contas (com saldo), cartões e contas recorrentes. Os dados ficam salvos neste aparelho, então faça o backup em ☰ &gt; Backup.</div></div>`:'')+`<div class="grid">
<button class="big r" onclick="start('d')"><span class="e">➖</span><span>Lançar despesa<br><small>Pix, cartão, crediário</small></span></button>
<button class="big g" onclick="start('r')"><span class="e">➕</span><span>Recebimentos<br><small>Salário, extras</small></span></button>
<button class="big" onclick="pagar()"><span class="e">💳</span><span>Pagar<br><small>${items.filter(i=>!i.p&&i.k=='d').length} contas em aberto</small></span></button>
<button class="big" onclick="dash()"><span class="e">📊</span><span>Dashboard<br><small>Visão do mês</small></span></button></div>`)}
function steps(){if(f.k=='r')return['valor','cat','conta','conf'];
const s=['valor','cat','pag'];
if(f.pag=='Cartão'){s.push('cartao');if(!isV(f.cartao)&&!f.pp)s.push('modo');if(f.modo=='Crédito parcelado'&&!f.pp)s.push('parc')}
if(f.pag=='Crediário'){s.push('quem');if(!f.pp)s.push('parc')}
s.push('conf');return s}
function setPP(c){f.pp=c;f.parc=c?Math.max(2,f.parc):1;f.pag=null;f.cartao=null;f.modo=null;draw()}
function updT(){const e=$('tt');if(e)e.textContent='parcelas · total '+R(f.v/100*f.parc);chk()}
function updP(){const e=$('pp');if(e)e.textContent=f.parc>1?f.parc+'x de '+R(f.v/100/f.parc):'';chk()}
function start(k){f={k,v:0,cat:null,pag:null,cartao:null,modo:null,parc:1,pp:false,dt:HOJE,q:'',o:'',i:0};draw()}
function back(){if(S=='flow'&&f.i>0){f.i--;draw()}else home()}
function key(n){if(n=='<')f.v=Math.floor(f.v/10);else if(f.v<1e8)f.v=f.v*10+n;draw()}
function pick(k,v){f[k]=v;if(k=='cartao'){if(isV(v))f.modo='Voucher';else if(f.modo=='Voucher')f.modo=null}if(k=='pag'){f.cartao=null;f.modo=f.pp&&v=='Cartão'?'Crédito parcelado':null;f.parc=f.pp?f.parc:1}draw()}
function next(){const s=steps();if(f.i<s.length-1){f.i++;draw()}else save()}
function chk(){const g=document.querySelector('.foot .go');if(g)g.disabled=!ok()}
function ok(){const s=steps()[f.i];if(s=='valor')return f.v>0&&(!f.pp||f.parc>=2);if(s=='parc')return f.parc>=2;
if(s=='cat')return f.cat;if(s=='pag')return f.pag;if(s=='cartao')return f.cartao;if(s=='modo')return f.modo;if(s=='conta')return f.pag;if(s=='quem')return (f.q||'').trim();return true}
function opts(list,key,cols){return '<div class="opts">'+list.map(o=>{const[e,n]=Array.isArray(o)?o:['',o];return `<button class="opt ${f[key]==n?'on':''}" onclick="pick('${key}','${n}')">${e?'<span class="e">'+e+'</span>':''}${n}</button>`}).join('')+'</div>'}
function draw(){S='flow';const s=steps()[f.i],d=f.k=='d';
head(d?'Lançar despesa':'Novo recebimento',true);
const v=`<div class="val ${d?'d':'c'}">${d?'−':'+'} ${R(f.v/100)}</div>`;
let b='';
if(s=='valor'){b=v+'<div class="keys">'+[1,2,3,4,5,6,7,8,9,'00',0,'<'].map(n=>`<button onclick="${n==='00'?'key(0);key(0)':`key(${typeof n=='number'?n:"'<'"})`}">${n=='<'?'⌫':n}</button>`).join('')+'</div>'+(d?`<label class="sans" style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px"><input type="checkbox" ${f.pp?'checked':''} onchange="setPP(this.checked)"> O valor acima é o da <b>parcela</b> (não o total)</label>`+(f.pp?`<div style="display:flex;gap:10px;align-items:center;margin-top:8px"><input type="number" inputmode="numeric" min="2" max="120" value="${f.parc}" oninput="f.parc=Math.min(120,Math.max(2,+this.value||2));updT()" style="width:110px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px" placeholder="Qtd."><span class="sans" id="tt" style="font-size:14px"></span></div>`:''):'')}
else if(s=='cat'){b='<h2>Categoria</h2>'+opts(d?CATS:RCATS,'cat')}
else if(s=='pag'){b='<h2>Como você pagou?</h2>'+opts(f.pp?[['💳','Cartão'],['🧾','Crediário']]:[['⚡','Pix'],['💵','Dinheiro'],['💳','Cartão'],['🧾','Crediário']],'pag')}
else if(s=='conta'){b='<h2>Recebeu onde?</h2>'+opts(CONTAS.map(c=>['🏦',c.n]),'pag')}
else if(s=='cartao'){b='<h2>Qual cartão?</h2>'+opts(CARTOES.map(c=>['💳',c.n]).concat(f.pp?[]:CONTAS.filter(c=>c.v).map(c=>['🎟️',c.n])),'cartao')}
else if(s=='modo'){b='<h2>Tipo</h2>'+opts([['💳','Crédito à vista'],['💳','Crédito parcelado'],['🏧','Débito']].map(x=>x),'modo')}
else if(s=='quem'){b='<datalist id=\"lj\">'+LOJAS.map(l=>'<option value=\"'+l+'\">').join('')+'</datalist><h2>Nome da loja</h2><input value="'+(f.q||'').replace(/"/g,'&quot;')+'" placeholder="Ex.: Loja da Josefa" oninput="f.q=this.value;chk()" style=\"width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)\"><h2 style="margin-top:18px">Observação <small class="sans" style="color:var(--mut);font-weight:400">(opcional)</small></h2><input value="'+(f.o||'').replace(/"/g,'&quot;')+'" placeholder="Ex.: sofá da sala" oninput="f.o=this.value" style=\"width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)\">'}
else if(s=='parc'){b=`<h2>Quantas parcelas?</h2><input type="number" inputmode="numeric" min="2" max="120" value="${f.parc>1?f.parc:''}" placeholder="Digite (ex.: 40)" oninput="f.parc=Math.min(120,Math.max(1,+this.value||1));updP()" ${IN}><p class="sans" id="pp" style="color:var(--mut);font-size:14px;margin-bottom:10px"></p><div class="opts">${[2,3,6,10,12,24,36,48,60].map(n=>`<button class="opt ${f.parc==n?'on':''}" onclick="pick('parc',${n})">${n}x</button>`).join('')}</div>`}
else{const p=f.parc>1;b=v+`<div class="row"><div class="t"><span>${f.cat}</span><b>${d?f.pag:f.pag}</b></div>${f.cartao?`<div class="s">${f.cartao} · ${f.modo}</div>`:''}${p?`<div class="s">${f.parc} parcelas de ${R(f.pp?f.v/100:f.v/100/f.parc)} (total ${R(f.pp?f.v/100*f.parc:f.v/100)}), uma por mês</div>`:''}</div><div class="s sans" style="margin:10px 0 4px">Data do lançamento (pode ser passada ou futura)</div><input type="date" value="${f.dt}" onchange="f.dt=this.value||HOJE;draw()" ${IN}><p class="s sans" style="color:var(--mut);font-size:13px;margin-top:10px">${d&&(f.modo=='Crédito à vista'||f.modo=='Crédito parcelado'||f.pag=='Crediário')?'Vai para "Pagar" na fatura/vencimento certo.':(f.dt>HOJE?'Data futura: fica agendado em '+(d?'Pagar':'A receber')+' até a data.':'Já entra como '+(d?'pago.':'recebido.'))}</p>`}
el(b);if(s=='valor')updT();if(s=='parc')updP();
foot(`<button onclick="home()">Cancelar</button><button class="go" ${ok()?'':'disabled'} onclick="next()">${s=='conf'?'Salvar':'Avançar'}</button>`)}
function save(){if(f.pag=='Crediário'&&f.q.trim()&&!LOJAS.includes(f.q.trim()))LOJAS.push(f.q.trim());if(f.pag=='Crediário'&&f.q.trim()&&!LOJAS.includes(f.q.trim()))LOJAS.push(f.q.trim());
const d=f.k=='d',n=f.parc||1,cred=d&&(f.pag=='Crediário'||f.modo=='Crédito à vista'||f.modo=='Crédito parcelado');
const t=f.pag=='Cartão'?(isV(f.cartao)?'Voucher ':'Cartão ')+f.cartao:f.pag;
for(let i=0;i<n;i++)items.push({id:++id,dt:n==1?f.dt:undefined,q:f.pag=='Crediário'?f.q.trim():'',o:f.pag=='Crediário'?f.o:'',d:(f.pag=='Crediário'&&f.q?f.q.trim():f.cat)+(n>1?` ${i+1}/${n}`:''),v:f.pp?f.v/100:Math.round(f.v/n)/100,t,c:f.cat,ve:!cred?f.dt:f.pag=='Cartão'?cardVe(f.cartao,i,f.dt):addM(f.dt,i+1),p:cred||f.dt>HOJE?0:1,k:f.k});
if(!cred&&f.dt<=HOJE)mv(f.k=='r'?f.pag:f.pag=='Cartão'&&isV(f.cartao)?f.cartao:f.pag=='Dinheiro'?'Dinheiro':main(),(f.k=='r'?1:-1)*f.v/100,f.cat,f.dt);toast('Salvo!');home()}
function saldoBlk(){const t=CONTAS.reduce((a,c)=>a+sal(c),0),o=O.sal;return `<div class="row" style="padding:0"><button style="width:100%;padding:14px;text-align:left;display:flex;justify-content:space-between;align-items:center" onclick="tg('sal')"><span><small class="sans" style="color:var(--mut);display:block;font-size:12px">Saldo em contas</small><b style="font-size:22px;color:${t<0?'var(--red)':'var(--ink)'}">${R(t)}</b></span><span style="font-size:18px;color:var(--mut)">${o?'▲':'▼'}</span></button>`+(o?'<div style="padding:0 14px 12px">'+CONTAS.map(c=>`<div class="sans" style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><span>${c.v?'🎟️ ':''}${c.n}</span><b>${R(sal(c))}</b></div>`).join('')+'</div>':'')+'</div>'}
function rcv(x){const i=items.find(a=>a.id==x);const a=i.a||PA;mv(a,i.v,i.d);i.p=1;toast('Recebido em '+a);dash()}
function contScr(e){S='cont';head('Contas e carteiras',true);foot();const X=e!=null?CONTAS[e]:null;

const tabs=`<div style="display:flex;gap:8px;margin-bottom:10px">${[['h','Histórico'],['m','Por mês']].map(([k,l])=>`<button class="opt ${RF.tab==k?'on':''}" style="flex:1;padding:10px" onclick="RF.tab='${k}';relScr()">${l}</button>`).join('')}</div>`;
if(RF.tab=='h'){const ms=[...new Set(MOV.map(m=>m.dt.slice(0,7)))].sort().reverse();
el(tabs+`<div style="display:flex;gap:6px;margin-bottom:8px"><select ${SS} onchange="RF.m=this.value;$('hl').innerHTML=hlist()"><option value="">Todos os meses</option>${ms.map(m=>`<option value="${m}" ${RF.m==m?'selected':''}>${mLabel(m)}</option>`).join('')}</select><select ${SS} onchange="RF.tp=this.value;$('hl').innerHTML=hlist()"><option value="">Entradas e saídas</option><option value="e" ${RF.tp=='e'?'selected':''}>Só entradas</option><option value="s" ${RF.tp=='s'?'selected':''}>Só saídas</option></select></div><input ${IN} placeholder="Buscar (descrição ou conta)" value="${esc(RF.q)}" oninput="RF.q=this.value;$('hl').innerHTML=hlist()"><div id="hl">${hlist()}</div>`);return}
const mm={};MOV.forEach(m=>{const k=m.dt.slice(0,7);mm[k]=mm[k]||{e:0,s:0};if(m.v>0)mm[k].e+=m.v;else mm[k].s-=m.v});
items.filter(i=>i.k=='d').forEach(i=>{const k=(i.dt||i.ve).slice(0,7);mm[k]=mm[k]||{e:0,s:0}});
el(tabs+'<p class="sans" style="color:var(--mut);font-size:12px;margin-bottom:8px">Entradas e saídas = dinheiro que realmente entrou/saiu. As categorias somam tudo que foi lançado no mês, inclusive o que ainda está a pagar.</p>'+(Object.keys(mm).sort().reverse().map(k=>{const x=mm[k],o=O['rm'+k],cats={};items.filter(i=>i.k=='d'&&(i.dt||i.ve).startsWith(k)).forEach(i=>cats[i.c]=(cats[i.c]||0)+i.v);
return `<div class="row" style="padding:0"><button style="width:100%;padding:12px 14px;text-align:left" onclick="O['rm${k}']=!O['rm${k}'];relScr()"><div style="display:flex;justify-content:space-between"><b>${mLabel(k)}</b><span>${o?'▲':'▼'}</span></div><div class="s sans" style="display:flex;justify-content:space-between"><span>Entradas <b style="color:var(--acc)">${R(x.e)}</b></span><span>Saídas <b style="color:var(--red)">${R(x.s)}</b></span></div></button>`+(o?'<div style="padding:0 14px 12px">'+(Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="sans" style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)"><span>${c}</span><b>${R(v)}</b></div>`).join(''):'<div class="s sans">Sem despesas lançadas.</div>')+`<button class="opt" style="width:100%;margin-top:8px;padding:10px" onclick="RF.tab='h';RF.m='${k}';relScr()">Ver movimentações do mês</button></div>`:'')+'</div>'}).join('')||'<div class="empty">Sem dados ainda.</div>'))}
const setArr=(a,b)=>a.splice(0,a.length,...b);
const snap=()=>({v:1,items,MOV,CONTAS,CARTOES,LOJAS,REC,ORC,CATS,id,PA,theme:document.documentElement.dataset.theme||''});
function apply(d){items=d.items||[];MOV=d.MOV||[];MOV.forEach(m=>{if(!m.dt)m.dt=HOJE});ORC=d.ORC||{};id=d.id||100;PA=d.PA||'Conta corrente';setArr(CONTAS,d.CONTAS||[]);setArr(CARTOES,d.CARTOES||[]);setArr(LOJAS,d.LOJAS||[]);setArr(REC,d.REC||[]);if(d.CATS)setArr(CATS,d.CATS);
if(!CONTAS.length)CONTAS.push({n:'Conta corrente',s:0});if(!CONTAS.some(c=>c.n==PA))PA=main();if(d.theme)document.documentElement.dataset.theme=d.theme}
function persist(){try{localStorage.setItem('mc_v1',JSON.stringify(snap()))}catch(e){}}
const DEMO=JSON.stringify(snap());
const fresh=()=>({items:[],MOV:[],CONTAS:[{n:'Conta corrente',s:0}],CARTOES:[],LOJAS:[],REC:[],ORC:{},id:100});
let raw=null;try{raw=localStorage.getItem('mc_v1')}catch(e){}
try{apply(raw?JSON.parse(raw):fresh())}catch(e){apply(fresh())}
let ZR=0;
function bakScr(){S='bak';head('Backup e dados',true);foot();ZR=0;
el(`<p class="sans" style="color:var(--mut);font-size:13px;margin-bottom:10px">Seus dados ficam salvos <b>neste aparelho e navegador</b>. Se limpar os dados do navegador ou trocar de celular, eles se perdem. Copie o backup e guarde (WhatsApp para você mesmo, e-mail, notas).</p>
<textarea id="bk" readonly ${IN} rows="4">${esc(JSON.stringify(snap()))}</textarea>
${BS('cpBk()','Copiar backup')}
<div class="mes">Restaurar de um backup</div><textarea id="br" ${IN} rows="3" placeholder="Cole aqui o backup copiado"></textarea>${BS('rsBk()','Restaurar')}
<div class="mes">Outras opções</div>
<button class="opt" style="width:100%;margin-bottom:8px" onclick="apply(JSON.parse(DEMO));gen();toast('Dados de exemplo carregados');home()">Carregar dados de exemplo</button>
<button id="zr" class="opt" style="width:100%;color:var(--red)" onclick="zero()">Apagar tudo e começar do zero</button>`)}
function cpBk(){const t=JSON.stringify(snap());(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copiado')).catch(()=>{$('bk').select();toast('Selecione e copie o texto')})}
function rsBk(){try{const d=JSON.parse($('br').value);if(!d.items)throw 0;apply(d);gen();toast('Restaurado');home()}catch(e){toast('Backup inválido')}}
function zero(){if(!ZR){ZR=1;$('zr').textContent='Toque de novo para confirmar';return}apply(fresh());toast('Tudo apagado');home()}
gen();home();
</script>
</body>
</html>
